
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clientes - Salsamentaria</title>

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS DEL PROYECTO -->
    <link
        rel="stylesheet"
        href="{{ url_for('estática', filename='CSS/productos.css') }}"
    >
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <nav class="navbar navbar-dark barra-superior">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Salsamentaria
            </span>

            <a
                href="{{ url_for('logout') }}"
                class="btn btn-outline-light"
            >
                Cerrar sesión
            </a>

        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container-fluid">
        <div class="row">

            <!-- MENÚ LATERAL -->
            {% include "_menu_lateral.html" %}

            <!-- CONTENIDO -->
            <main class="col-md-10 contenido">
                <div class="container-fluid">

                    <!-- ENCABEZADO -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h1>Clientes</h1>
                        </div>
                    </div>

                    <!-- MENSAJES DE ÉXITO Y ERROR -->
                    {% with mensajes = get_flashed_messages(with_categories=true) %}
                        {% if mensajes %}
                            {% for categoria, mensaje in mensajes %}

                                <div
                                    class="alert alert-{{ categoria }} alert-dismissible fade show"
                                    role="alert"
                                >
                                    {{ mensaje }}

                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="alert"
                                        aria-label="Cerrar"
                                    ></button>
                                </div>

                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- REGISTRAR CLIENTE -->
                    <div class="card tarjeta mb-4">
                        <div class="card-body">

                            <h4 class="mb-4">
                                Registrar cliente
                            </h4>

                            <form
                                action="{{ url_for('agregar_cliente') }}"
                                method="POST"
                            >

                                <div class="row">

                                    <!-- NOMBRE -->
                                    <div class="col-md-6 mb-3">
                                        <label
                                            for="nombre"
                                            class="form-label"
                                        >
                                            Nombre
                                        </label>

                                        <input
                                            type="text"
                                            id="nombre"
                                            name="nombre"
                                            class="form-control"
                                            placeholder="Nombre completo"
                                            required
                                        >
                                    </div>

                                    <!-- TELÉFONO -->
                                    <div class="col-md-6 mb-3">
                                        <label
                                            for="telefono"
                                            class="form-label"
                                        >
                                            Teléfono
                                        </label>

                                        <input
                                            type="text"
                                            id="telefono"
                                            name="telefono"
                                            class="form-control"
                                        >
                                    </div>

                                    <!-- DIRECCIÓN -->
                                    <div class="col-md-6 mb-3">
                                        <label
                                            for="direccion"
                                            class="form-label"
                                        >
                                            Dirección
                                        </label>

                                        <input
                                            type="text"
                                            id="direccion"
                                            name="direccion"
                                            class="form-control"
                                        >
                                    </div>

                                    <!-- CORREO -->
                                    <div class="col-md-6 mb-3">
                                        <label
                                            for="email"
                                            class="form-label"
                                        >
                                            Correo electrónico
                                        </label>

                                        <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            class="form-control"
                                            placeholder="correo@ejemplo.com"
                                        >
                                    </div>

                                </div>

                                <!-- BOTÓN -->
                                <div class="mt-2">
                                    <button
                                        type="submit"
                                        class="btn btn-dark"
                                    >
                                        Registrar cliente
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </main>

        </div>
    </div>

    <!-- JAVASCRIPT INVENTARIO -->
    <script>
        function mostrarInventario(event) {
            event.preventDefault();

            const opciones = document.getElementById("opcionesInventario");
            const flecha = document.getElementById("flechaInventario");

            if (!opciones || !flecha) {
                return;
            }

            if (opciones.style.display === "none") {
                opciones.style.display = "block";
                flecha.textContent = "⌄";
            } else {
                opciones.style.display = "none";
                flecha.textContent = "›";
            }
        }
    </script>

    <!-- BOOTSTRAP JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>
</html>
