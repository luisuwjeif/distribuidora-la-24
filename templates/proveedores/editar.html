<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar proveedor - Salsamentaria</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS del proyecto -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/productos.css') }}"
    >
</head>

<body>

<!-- ============================= -->
<!-- BARRA SUPERIOR -->
<!-- ============================= -->

<nav class="navbar navbar-dark barra-superior">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            Salsamentaria
        </span>

        <a
            href="{{ url_for('logout') }}"
            class="btn btn-outline-light"
        >
            Cerrar sesión
        </a>

    </div>

</nav>


<div class="container-fluid">

    <div class="row">


        <!-- ============================= -->
        <!-- MENÚ LATERAL -->
        <!-- ============================= -->

        {% include "_menu_lateral.html" %}


        <!-- ============================= -->
        <!-- CONTENIDO -->
        <!-- ============================= -->

        <main class="col-md-10 contenido">

            <div class="container-fluid">


                <!-- TÍTULO -->

                <div class="mb-4">

                    <h1>
                        Editar proveedor
                    </h1>

                    <p class="text-muted mb-0">
                        Modifica la información del proveedor seleccionado.
                    </p>

                </div>


                <!-- ============================= -->
                <!-- FORMULARIO -->
                <!-- ============================= -->

                <div class="card tarjeta">

                    <div class="card-body">

                        <h4 class="mb-4">
                            Información del proveedor
                        </h4>


                        <form method="POST">

                            <div class="row">


                                <!-- NOMBRE -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="nombre"
                                        class="form-label"
                                    >
                                        Nombre
                                    </label>

                                    <input
                                        type="text"
                                        id="nombre"
                                        name="nombre"
                                        class="form-control"
                                        value="{{ proveedor[1] }}"
                                        required
                                    >

                                </div>


                                <!-- NIT -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="nit"
                                        class="form-label"
                                    >
                                        NIT
                                    </label>

                                    <input
                                        type="text"
                                        id="nit"
                                        name="nit"
                                        class="form-control"
                                        value="{{ proveedor[2] or '' }}"
                                    >

                                </div>


                                <!-- TELÉFONO -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="telefono"
                                        class="form-label"
                                    >
                                        Teléfono
                                    </label>

                                    <input
                                        type="text"
                                        id="telefono"
                                        name="telefono"
                                        class="form-control"
                                        value="{{ proveedor[3] or '' }}"
                                    >

                                </div>


                                <!-- DIRECCIÓN -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="direccion"
                                        class="form-label"
                                    >
                                        Dirección
                                    </label>

                                    <input
                                        type="text"
                                        id="direccion"
                                        name="direccion"
                                        class="form-control"
                                        value="{{ proveedor[4] or '' }}"
                                    >

                                </div>


                                <!-- CORREO -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="email"
                                        class="form-label"
                                    >
                                        Correo electrónico
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        class="form-control"
                                        value="{{ proveedor[5] or '' }}"
                                    >

                                </div>


                                <!-- ESTADO -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="estado"
                                        class="form-label"
                                    >
                                        Estado
                                    </label>

                                    <select
                                        id="estado"
                                        name="estado"
                                        class="form-select"
                                    >

                                        <option
                                            value="Activo"
                                            {% if proveedor[6] == "Activo" %}
                                                selected
                                            {% endif %}
                                        >
                                            Activo
                                        </option>

                                        <option
                                            value="Inactivo"
                                            {% if proveedor[6] == "Inactivo" %}
                                                selected
                                            {% endif %}
                                        >
                                            Inactivo
                                        </option>

                                    </select>

                                </div>


                            </div>


                            <!-- ============================= -->
                            <!-- BOTONES -->
                            <!-- ============================= -->

                            <div class="mt-3">

                                <button
                                    type="submit"
                                    class="btn btn-dark"
                                >
                                    Guardar cambios
                                </button>


                                <a
                                    href="{{ url_for('proveedores') }}"
                                    class="btn btn-outline-secondary ms-2"
                                >
                                    Cancelar
                                </a>

                            </div>


                        </form>

                    </div>

                </div>


            </div>

        </main>

    </div>

</div>


<!-- ============================= -->
<!-- JAVASCRIPT INVENTARIO -->
<!-- ============================= -->

<script>

    function mostrarInventario(event) {

        event.preventDefault();

        const opciones =
            document.getElementById("opcionesInventario");

        const flecha =
            document.getElementById("flechaInventario");


        if (opciones.style.display === "none") {

            opciones.style.display = "block";

            flecha.textContent = "⌄";

        } else {

            opciones.style.display = "none";

            flecha.textContent = "›";

        }

    }

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
