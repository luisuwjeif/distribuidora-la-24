<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bodegas - Salsamentaria</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS del proyecto -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/productos.css') }}"
    >
</head>

<body>

<!-- ============================= -->
<!-- BARRA SUPERIOR -->
<!-- ============================= -->

<nav class="navbar navbar-dark barra-superior">

    <div class="container-fluid">

        <span class="navbar-brand mb-0 h1">
            Salsamentaria
        </span>

        <a
            href="{{ url_for('logout') }}"
            class="btn btn-outline-light"
        >
            Cerrar sesión
        </a>

    </div>

</nav>


<div class="container-fluid">

    <div class="row">


        <!-- ============================= -->
        <!-- MENÚ LATERAL -->
        <!-- ============================= -->

        {% include "_menu_lateral.html" %}


        <!-- ============================= -->
        <!-- CONTENIDO -->
        <!-- ============================= -->

        <main class="col-md-10 contenido">

            <div class="container-fluid">


                <!-- TÍTULO -->

                <div class="mb-4">

                    <h1>
                        Bodegas
                    </h1>


                </div>


                <!-- ============================= -->
                <!-- MENSAJES -->
                <!-- ============================= -->

                {% with mensajes = get_flashed_messages(with_categories=true) %}

                    {% if mensajes %}

                        {% for categoria, mensaje in mensajes %}

                            <div
                                class="alert alert-{{ categoria }} alert-dismissible fade show"
                                role="alert"
                            >

                                {{ mensaje }}

                                <button
                                    type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert"
                                ></button>

                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}



                <!-- ============================= -->
                <!-- REGISTRAR BODEGA -->
                <!-- ============================= -->

                <div class="card tarjeta mb-4">

                    <div class="card-body">

                        <h4 class="mb-4">
                            Registrar bodega
                        </h4>


                        <form
                            action="{{ url_for('agregar_bodega') }}"
                            method="POST"
                        >

                            <div class="row">


                                <!-- NOMBRE -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="nom_bod"
                                        class="form-label"
                                    >
                                        Nombre de la bodega
                                    </label>

                                    <input
                                        type="text"
                                        id="nom_bod"
                                        name="nom_bod"
                                        class="form-control"
                                        required
                                    >

                                </div>


                                <!-- DIRECCIÓN -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="dir_bod"
                                        class="form-label"
                                    >
                                        Dirección
                                    </label>

                                    <input
                                        type="text"
                                        id="dir_bod"
                                        name="dir_bod"
                                        class="form-control"
                                    >

                                </div>


                                <!-- DESCRIPCIÓN -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="descripcion"
                                        class="form-label"
                                    >
                                        Descripción
                                    </label>

                                    <input
                                        type="text"
                                        id="descripcion"
                                        name="descripcion"
                                        class="form-control"
                                    >

                                </div>


                                <!-- ESTADO -->

                                <div class="col-md-6 mb-3">

                                    <label
                                        for="estado"
                                        class="form-label"
                                    >
                                        Estado
                                    </label>

                                    <select
                                        id="estado"
                                        name="estado"
                                        class="form-select"
                                    >

                                        <option value="Activo">
                                            Activo
                                        </option>

                                        <option value="Inactivo">
                                            Inactivo
                                        </option>

                                    </select>

                                </div>


                            </div>


                            <!-- BOTÓN -->

                            <div class="mt-2">

                                <button
                                    type="submit"
                                    class="btn btn-dark"
                                >
                                    Registrar bodega
                                </button>

                            </div>

                        </form>

                    </div>

                </div>




<!-- ============================= -->
<!-- JAVASCRIPT INVENTARIO -->
<!-- ============================= -->

<script>

    function mostrarInventario(event) {

        event.preventDefault();

        const opciones =
            document.getElementById("opcionesInventario");

        const flecha =
            document.getElementById("flechaInventario");


        if (opciones.style.display === "none") {

            opciones.style.display = "block";

            flecha.textContent = "⌄";

        } else {

            opciones.style.display = "none";

            flecha.textContent = "›";

        }

    }

</script>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
