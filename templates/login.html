<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - Salsamentaria</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS del login -->
    <link rel="stylesheet" href="{{ url_for('estática', filename='CSS/login.css') }}">
</head>

<body>

    <div class="login-contenedor">

        <div class="login-box">

            <!-- Imagen de perfil -->
            <img src="{{ url_for('estática', filename='IMG/logo.png') }}"
                 class="imagen-perfil"
                 alt="Perfil">


            <h2>Iniciar sesión</h2>

            <form method="POST" action="/">

                <label for="usuario">Usuario:</label>

                <input type="text"
                       id="usuario"
                       name="usuario"
                       required>


                <label for="clave">Contraseña:</label>

                <input type="password"
                       id="clave"
                       name="clave"
                       required>

                <label for="verClave" style="display: block; margin-top: 10px; cursor: pointer; font-weight: normal;">
                    <input type="checkbox"
                           id="verClave"
                           style="width: auto; display: inline-block; margin: 0 6px 0 0; padding: 0; vertical-align: middle;">
                    Mostrar contraseña
                </label>


                <button type="submit">
                    Ingresar
                </button>

            </form>

            {% if mensaje %}
                <p class="mensaje">{{ mensaje }}</p>
            {% endif %}

        </div>

    </div>

<script>
    document.getElementById("verClave").addEventListener("change", function (e) {
        document.getElementById("clave").type = e.target.checked ? "text" : "password";
    });
</script>

</body>
</html>
